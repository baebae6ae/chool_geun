name: Test Android app (emulator)

# 가상 안드로이드 폰(에뮬레이터)에서 앱을 설치·실행하고, 화면을 직접 눌러 점검한 뒤 캡처를 남긴다.
# 수동으로만 실행한다 (Actions 탭 > Test Android app (emulator) > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Prepare Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug apk (WebView debugging is on in debug builds)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Chrome DevTools Protocol client
        run: npm i --no-save chrome-remote-interface

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and check screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/emulator-e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 14

      # 점검 결과 중 위젯 그림만 ci-screens 브랜치에 올려 둔다 (아티팩트를 열 수 없는 환경에서도 git으로 받아 보기 위해)
      - name: Publish widget screenshots to ci-screens branch
        if: always()
        run: |
          mkdir -p /tmp/pub
          cp e2e-out/widget-*.png /tmp/pub/ 2>/dev/null || true
          cp e2e-out/results.json /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          [ -n "$(ls -A)" ] || exit 0
          git init -q
          git checkout -q -b ci-screens
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens
