name: Build Android app (TWA)

# 플레이스토어에 올릴 안드로이드 앱(.aab)과 손으로 설치해 볼 .apk를 만든다.
# 수동으로만 실행한다 (Actions 탭 > Build Android app (TWA) > Run workflow).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (cmdline-tools "latest" symlink + accept licenses)
        run: |
          if [ ! -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            VER=$(ls "$ANDROID_HOME/cmdline-tools" | grep -v '^latest$' | sort -V | tail -1)
            echo "linking cmdline-tools/$VER -> cmdline-tools/latest"
            ln -s "$VER" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's existing JDK/SDK (skip its interactive prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Build signed app bundle + apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation \
            --password="$ANDROID_KEYSTORE_PASSWORD" \
            --keyPassword="$ANDROID_KEY_PASSWORD"

      - name: Locate build output
        run: |
          echo "----- app-release-signed.aab -----"
          find . -maxdepth 2 -iname "*.aab" -exec ls -la {} \;
          echo "----- app-release-signed.apk -----"
          find . -maxdepth 2 -iname "*.apk" -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: hamster-worklog-android
          path: |
            *.aab
            *.apk
          if-no-files-found: error
          retention-days: 30
