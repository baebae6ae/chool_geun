name: Build Android app (Capacitor)

# 플레이스토어에 올릴 안드로이드 앱(.aab)과 직접 설치해 볼 수 있는 .apk를 만든다.
# 수동으로만 실행한다 (Actions 탭 > Build Android app (Capacitor) > Run workflow).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '앱 버전 이름 (예: 1.0.0)'
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Prepare Android SDK (licenses + platform)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platform-tools"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.keystore"

      - name: Build signed app bundle (.aab) and apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Locate build output
        run: find android/app/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: hamster-worklog-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
