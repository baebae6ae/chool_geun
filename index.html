<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="햄스터 출근일지" />
    <meta name="description" content="일하는 시간만큼 햄스터가 무언가를 만들고, 퇴근하면 하나가 완성되는 앱" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>햄스터 출근일지</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <!-- 색연필로 그린 듯 선이 살짝 떨리고 칠이 거칠게 -->
        <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="warp" />
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="3" xChannelSelector="R" yChannelSelector="G" result="wob" />
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="grain" />
          <feColorMatrix in="grain" type="matrix" values="0.35 0 0 0 0.8  0.35 0 0 0 0.8  0.35 0 0 0 0.8  0 0 0 0 1" result="speckle" />
          <feBlend in="wob" in2="speckle" mode="multiply" result="paint" />
          <feComposite in="paint" in2="wob" operator="in" />
        </filter>
        <!-- 햄스터 털: 모양은 그대로, 색연필 칠한 알갱이만 -->
        <filter id="pencil-fur" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5" result="g" />
          <feColorMatrix in="g" type="matrix" values="0.45 0 0 0 0.7  0.45 0 0 0 0.7  0.45 0 0 0 0.7  0 0 0 0 1" result="sp" />
          <feBlend in="SourceGraphic" in2="sp" mode="multiply" result="p" />
          <feComposite in="p" in2="SourceGraphic" operator="in" />
        </filter>
        <!-- 햄스터 전체: 선이 살짝 떨리고 종이 알갱이가 비치게 (모양·투명도는 유지) -->
        <filter id="pencil-hs" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="w" />
          <feDisplacementMap in="SourceGraphic" in2="w" scale="4.2" xChannelSelector="R" yChannelSelector="G" result="wob" />
          <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11" result="g" />
          <feColorMatrix in="g" type="matrix" values="0.6 0 0 0 0.64  0.6 0 0 0 0.64  0.6 0 0 0 0.64  0 0 0 0 1" result="sp" />
          <feBlend in="wob" in2="sp" mode="multiply" result="p" />
          <feComposite in="p" in2="wob" operator="in" />
        </filter>
        <!-- 이모지용: 윤곽만 살짝 떨리게 (칠은 그대로) -->
        <filter id="pencil-soft" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2" result="w" />
          <feDisplacementMap in="SourceGraphic" in2="w" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- 사무실 물건: 색을 단순화(포스터화) + 윤곽 떨림 -->
        <filter id="pencil-emoji" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feComponentTransfer result="flat">
            <feFuncR type="discrete" tableValues="0.18 0.38 0.58 0.78 0.94 1" />
            <feFuncG type="discrete" tableValues="0.18 0.38 0.58 0.78 0.94 1" />
            <feFuncB type="discrete" tableValues="0.18 0.38 0.58 0.78 0.94 1" />
          </feComponentTransfer>
          <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="w" />
          <feDisplacementMap in="flat" in2="w" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- 색연필 빗금: 햄스터 몸 아래쪽과 그림자 쪽에만 진하게 -->
        <pattern id="pencil-hatch" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(48)">
          <line x1="0" y1="0" x2="0" y2="3.6" stroke="#b9743f" stroke-width="1.05" stroke-linecap="round" />
        </pattern>
        <linearGradient id="pencil-fade" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0.35" stop-color="#000" />
          <stop offset="1" stop-color="#fff" />
        </linearGradient>
        <mask id="pencil-shade" maskContentUnits="objectBoundingBox">
          <rect x="-0.1" y="-0.1" width="1.2" height="1.2" fill="url(#pencil-fade)" />
        </mask>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
